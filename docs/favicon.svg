    <!-- Tassel Button & Cord -->
    <circle cx="32" cy="26" r="2" fill="#FBBF24"/>
    <path d="M33,26 Q46,27 48,34 L48,43" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="44" r="2.2" fill="#FBBF24"/>
  </g>
